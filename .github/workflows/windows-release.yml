name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            harness/package-lock.json

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund

      - name: Build installer and portable executable
        run: npm run build:windows

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-windows-x64
          if-no-files-found: error
          path: |
            dist/DeepSeek-Harness-Desktop-Setup-*-x64.exe
            dist/DeepSeek-Harness-Desktop-Portable-*-x64.exe
            dist/DeepSeek-Harness-Desktop-Source-*.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem dist/DeepSeek-Harness-Desktop-Setup-*-x64.exe).FullName
            (Get-ChildItem dist/DeepSeek-Harness-Desktop-Portable-*-x64.exe).FullName
            (Get-ChildItem dist/DeepSeek-Harness-Desktop-Source-*.zip).FullName
            (Resolve-Path dist/SHA256SUMS.txt).Path
          )
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets `
              --verify-tag `
              --generate-notes `
              --title "DeepSeek Harness Desktop $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release command failed with exit code $LASTEXITCODE" }
